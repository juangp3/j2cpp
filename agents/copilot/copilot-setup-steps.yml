# Copy to .github/workflows/copilot-setup-steps.yml in your repository so
# Copilot's cloud coding agent has Java and Node.js for the J2C MCP server
# (agents/copilot/mcp-config.json), and a C++20 compiler to build its output.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Downloads the server once, so the agent's first call is fast
      - name: Cache the J2C MCP server
        run: npx -y -p @juangp3/j2c-mcp@0.6.0 j2c --version
      - name: Install a C++20 compiler and make
        run: sudo apt-get update && sudo apt-get install -y g++ make
