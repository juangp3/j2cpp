name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["11", "17"]
    name: Build and package (Java ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install extension build dependencies
        working-directory: vscode
        run: npm ci
      - name: Build, test, and package extension
        working-directory: vscode
        run: npm run package
      - name: Compile generated C++20 fixtures and run smoke tests
        if: matrix.java-version == '17'
        env:
          # Generated code must be free of undefined behavior
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: |
          for pair in ControlFlow:control-flow Records:records Features:features Lambdas:lambdas Collections:collections Arithmetic:arithmetic Patterns:patterns; do
            fixture="${pair%%:*}"
            out="target/cpp-${pair##*:}"
            mkdir -p "$out"
            java -jar target/j2c-cli.jar --output "$out" --sourcepath test/src "test/src/se/arnetheduck/j2c/test/Java17$fixture.java"
            make -C "$out"
          done
          for smoke in Lambdas Records Arithmetic Patterns; do
            out="target/cpp-$(echo "$smoke" | tr '[:upper:]' '[:lower:]')"
            g++ -std=c++20 -fwrapv $CFLAGS -I"$out/src" -I"$out/ext/src" "test/cpp/Java17${smoke}Smoke.cpp" -L"$out/bin" -l"$(basename "$out")" -l"$(basename "$out")-ext" -o "$out/bin/smoke"
            "$out/bin/smoke"
          done
          g++ -std=c++20 -fwrapv $CFLAGS -ffunction-sections -fdata-sections -Wl,--gc-sections -Itarget/cpp-control-flow/src -Itarget/cpp-control-flow/ext/src test/cpp/Java17ControlFlowSmoke.cpp target/cpp-control-flow/src/se/arnetheduck/j2c/test/Java17ControlFlow.cpp -o target/cpp-control-flow/bin/switch-value-smoke
          target/cpp-control-flow/bin/switch-value-smoke
          # #line directives (--line-directives) must compile and keep behavior
          out=target/cpp-lambdas-lines
          mkdir -p "$out"
          java -jar target/j2c-cli.jar --line-directives --output "$out" --sourcepath test/src test/src/se/arnetheduck/j2c/test/Java17Lambdas.java
          grep -q '^#line ' "$out/src/se/arnetheduck/j2c/test/Java17Lambdas.cpp"
          make -C "$out"
          g++ -std=c++20 -fwrapv $CFLAGS -I"$out/src" -I"$out/ext/src" test/cpp/Java17LambdasSmoke.cpp -L"$out/bin" -l"$(basename "$out")" -l"$(basename "$out")-ext" -o "$out/bin/smoke"
          "$out/bin/smoke"
      - name: Install GoogleTest, gMock, the Boehm collector and GNU time
        if: matrix.java-version == '17'
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev libgc-dev time
      # Some fixture tests fail on purpose; every outcome is compared with
      # test/junit*/expected-results.json instead
      - name: Run translated JUnit tests with GoogleTest (stubbed JDK classes)
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/junit-gtest.js
      - name: Run translated JUnit tests with GoogleTest and the J2C runtime, comparing failure messages
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/junit-gtest.js --runtime
      # The gMock classes of --mocks, used by the hand-written
      # test/cpp/Java17MocksTest.cpp, and every mock of test/src compiled
      - name: Run a hand-written gMock test against classes generated with --mocks
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/mocks-gtest.js
      - name: Run the JUnit fixtures with real JUnit on the JVM and compare with the expected results
        if: matrix.java-version == '17'
        run: node vscode/scripts/junit-jvm.js
      - name: Run test/runtime programs with the J2C runtime and compare with java
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/runtime-programs.js
      - name: Run test/runtime programs with the runtime packaged in the CLI JAR (--runtime bundled)
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/runtime-programs.js --runtime bundled --program hello,collections,files,regex
      - name: Run allocation-heavy test/runtime programs with the Boehm collector (J2C_GC=boehm)
        if: matrix.java-version == '17'
        env:
          # Replacing operator new rules out AddressSanitizer
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        # The allocation test, the programs that allocate most, and two that
        # allocate from several threads; the nightly Corpus workflow runs
        # every program with the collector
        run: node vscode/scripts/runtime-programs.js --gc boehm --program allocation,collections,streams,rethrow,concurrent,threads-wait
      - name: Probe translation gaps
        if: matrix.java-version == '17'
        working-directory: vscode
        run: npm run probe
      - name: Check the agent benchmark's graders (no agent runs)
        if: matrix.java-version == '17'
        working-directory: vscode
        run: npm run bench:selftest
      - name: Upload VSIX
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: j2c-vsix
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
