name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["11", "17"]
    name: Build and package (Java ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install extension build dependencies
        working-directory: vscode
        run: npm ci
      - name: Build, test, and package extension
        working-directory: vscode
        run: npm run package
      - name: Compile generated C++20 fixtures
        if: matrix.java-version == '17'
        run: |
          mkdir -p target/cpp-control-flow target/cpp-records
          java -jar target/j2c-cli.jar --output target/cpp-control-flow --sourcepath test/src test/src/se/arnetheduck/j2c/test/Java17ControlFlow.java
          java -jar target/j2c-cli.jar --output target/cpp-records --sourcepath test/src test/src/se/arnetheduck/j2c/test/Java17Records.java
          make -C target/cpp-control-flow
          make -C target/cpp-records
          g++ -std=c++20 -ffunction-sections -fdata-sections -Wl,--gc-sections -Itarget/cpp-control-flow/src -Itarget/cpp-control-flow/ext/src test/cpp/Java17ControlFlowSmoke.cpp target/cpp-control-flow/src/se/arnetheduck/j2c/test/Java17ControlFlow.cpp -o target/cpp-control-flow/bin/switch-value-smoke
          target/cpp-control-flow/bin/switch-value-smoke
      - name: Upload VSIX
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: j2c-vsix
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
