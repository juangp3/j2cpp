name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["11", "17"]
    name: Build and package (Java ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install extension build dependencies
        working-directory: vscode
        run: npm ci
      - name: Build, test, and package extension
        working-directory: vscode
        run: npm run package
      - name: Compile generated C++20 fixtures and run smoke tests
        if: matrix.java-version == '17'
        env:
          # Generated code must be free of undefined behavior
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: |
          for pair in ControlFlow:control-flow Records:records Features:features Lambdas:lambdas Collections:collections Arithmetic:arithmetic Patterns:patterns; do
            fixture="${pair%%:*}"
            out="target/cpp-${pair##*:}"
            mkdir -p "$out"
            java -jar target/j2c-cli.jar --output "$out" --sourcepath test/src "test/src/se/arnetheduck/j2c/test/Java17$fixture.java"
            make -C "$out"
          done
          for smoke in Lambdas Records Arithmetic Patterns; do
            out="target/cpp-$(echo "$smoke" | tr '[:upper:]' '[:lower:]')"
            g++ -std=c++20 -fwrapv $CFLAGS -I"$out/src" -I"$out/ext/src" "test/cpp/Java17${smoke}Smoke.cpp" -L"$out/bin" -l"$(basename "$out")" -l"$(basename "$out")-ext" -o "$out/bin/smoke"
            "$out/bin/smoke"
          done
          g++ -std=c++20 -fwrapv $CFLAGS -ffunction-sections -fdata-sections -Wl,--gc-sections -Itarget/cpp-control-flow/src -Itarget/cpp-control-flow/ext/src test/cpp/Java17ControlFlowSmoke.cpp target/cpp-control-flow/src/se/arnetheduck/j2c/test/Java17ControlFlow.cpp -o target/cpp-control-flow/bin/switch-value-smoke
          target/cpp-control-flow/bin/switch-value-smoke
      - name: Install GoogleTest, the Boehm collector and GNU time
        if: matrix.java-version == '17'
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgc-dev time
      - name: Run translated JUnit tests with GoogleTest
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: |
          out=target/cpp-junit
          mkdir -p "$out"
          java -jar target/j2c-cli.jar --tests --output "$out" --sourcepath "test/junit:test/junit-api" test/junit
          mkdir -p "$out/obj"
          g++ -std=c++20 -fwrapv $CFLAGS -I"$out/src" -I"$out/ext/src" -c test/cpp/j2c_test_hooks.cpp -o "$out/obj/hooks.o"
          make -C "$out" tests TEST_LDLIBS=obj/hooks.o
          # Some fixture tests fail on purpose; every outcome is compared instead
          "$out/bin/cpp-junit-tests" --gtest_output=json:"$out/results.json" || true
          node vscode/scripts/check-gtest.js "$out/results.json" test/junit/expected-results.json
      - name: Run test/runtime programs with the J2C runtime and compare with java
        if: matrix.java-version == '17'
        env:
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/runtime-programs.js
      - name: Run test/runtime programs with the Boehm collector (J2C_GC=boehm)
        if: matrix.java-version == '17'
        env:
          # Replacing operator new rules out AddressSanitizer
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/runtime-programs.js --gc boehm
      - name: Probe translation gaps
        if: matrix.java-version == '17'
        working-directory: vscode
        run: npm run probe
      - name: Upload VSIX
        if: matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: j2c-vsix
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
