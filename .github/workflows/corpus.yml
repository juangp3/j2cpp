name: Corpus

# Checks the validation corpus (test/corpus/projects.json) against its
# expected results; see docs/VALIDATION_ROADMAP.md, milestone M1. Slow, so it
# runs nightly and on demand rather than on every push.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      projects:
        description: "Comma-separated project names (empty for all)"
        required: false
        default: ""
      build:
        description: "Also translate and compile clean projects"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the CLI
        run: mvn -q package -DskipTests
      - name: Cache corpus sources and dependency JARs
        uses: actions/cache@v4
        with:
          path: |
            target/corpus/src
            target/corpus/deps
          key: corpus-${{ hashFiles('test/corpus/projects.json') }}
          restore-keys: corpus-
      - name: Check the corpus
        env:
          PROJECTS: ${{ inputs.projects }}
          BUILD: ${{ inputs.build }}
        run: |
          args=(--jobs 4)
          if [ -n "$PROJECTS" ]; then args+=(--project "$PROJECTS"); fi
          # Nightly runs also build the small and medium tiers
          if [ "$BUILD" = "true" ]; then
            args+=(--build)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--build --build-tier small,medium)
          fi
          node vscode/scripts/corpus.js "${args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-results
          path: target/corpus/results.json
          if-no-files-found: ignore
          retention-days: 14

  # Every test/runtime program with the Boehm collector; CI on each push runs
  # only the allocation-heavy ones
  runtime-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Boehm collector and GNU time
        run: sudo apt-get update && sudo apt-get install -y libgc-dev time
      - name: Build the CLI
        run: mvn -q package -DskipTests
      - name: Run test/runtime programs with J2C_GC=boehm
        env:
          # Replacing operator new rules out AddressSanitizer
          CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all
        run: node vscode/scripts/runtime-programs.js --gc boehm
